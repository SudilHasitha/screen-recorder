[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'"
    Permissions-Policy = "display-capture=(self), microphone=(self), fullscreen=(self)"
    Feature-Policy = "display-capture 'self'; microphone 'self'; fullscreen 'self'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
